services:
  aiopicks:
    build:
      context: .
    image: aiopicks:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite+aiosqlite:////data/aiopicks.db
    volumes:
      - aiopicks-data:/data
    restart: unless-stopped

volumes:
  aiopicks-data:
